<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 1300" style="background:#ffffff;font-family:Arial,Helvetica,sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- HEADER -->
  <rect x="20" y="14" width="860" height="40" rx="8" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="450" y="39" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Raccolta Differenziata — Schema Storia</text>

  <!-- DAY 1 -->
  <rect x="20" y="74" width="220" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="130" y="91" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Day 1 — Tutorial</text>
  <text x="130" y="108" text-anchor="middle" font-size="11" fill="#0F6E56">skippabile</text>

  <!-- DAY 2 -->
  <rect x="20" y="140" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="130" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">Day 2 — 5 rifiuti</text>
  <text x="130" y="178" text-anchor="middle" font-size="11" fill="#185FA5">4 normali + 1 morale + 1 bloody bag</text>

  <!-- day2 → ubbidiente -->
  <line x1="240" y1="155" x2="288" y2="148" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="132" width="150" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="365" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#2C2C2A">Sii ubbidiente</text>

  <!-- day2 → ribellati -->
  <line x1="240" y1="172" x2="288" y2="180" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="164" width="150" height="32" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="365" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#501313">Ribellati</text>

  <!-- divider -->
  <line x1="20" y1="220" x2="880" y2="220" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="20" y="237" font-size="11" fill="#888780" font-style="italic">Percorso A — ubbidiente</text>

  <!-- DAY 3A -->
  <rect x="20" y="250" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="130" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">Day 3 — ubbidiente</text>
  <text x="130" y="287" text-anchor="middle" font-size="11" fill="#185FA5">situazione peggiora</text>

  <line x1="240" y1="265" x2="288" y2="258" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="242" width="130" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="355" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#2C2C2A">6 normali</text>

  <line x1="240" y1="283" x2="288" y2="292" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="276" width="175" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="377" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#4A1B0C">2 gore (pezzi umani)</text>

  <!-- gore 3A → ubbidisci -->
  <line x1="465" y1="283" x2="503" y2="270" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="505" y="254" width="100" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="555" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#2C2C2A">Ubbidisci</text>
  <line x1="605" y1="270" x2="635" y2="270" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="637" y="254" width="85" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="679" y="267" text-anchor="middle" font-size="11" font-weight="600" fill="#085041">Day 4A</text>
  <text x="679" y="280" text-anchor="middle" font-size="10" fill="#0F6E56">Bimbo</text>

  <!-- gore 3A → ribellati -->
  <line x1="465" y1="298" x2="503" y2="310" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="505" y="294" width="100" height="32" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="555" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#501313">Ribellati</text>
  <line x1="605" y1="310" x2="635" y2="310" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="637" y="294" width="85" height="32" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="679" y="307" text-anchor="middle" font-size="11" font-weight="600" fill="#501313">Day 4B</text>
  <text x="679" y="320" text-anchor="middle" font-size="10" fill="#A32D2D">Suicidio</text>

  <!-- divider -->
  <line x1="20" y1="350" x2="880" y2="350" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="20" y="367" font-size="11" fill="#888780" font-style="italic">Percorso B — rebellion</text>

  <!-- DAY 3B -->
  <rect x="20" y="380" width="220" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="130" y="398" text-anchor="middle" font-size="13" font-weight="600" fill="#501313">Day 3 — rebellion</text>
  <text x="130" y="417" text-anchor="middle" font-size="11" fill="#A32D2D">persone ti chiedono collab.</text>

  <line x1="240" y1="394" x2="288" y2="386" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="370" width="130" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="355" y="386" text-anchor="middle" font-size="12" font-weight="600" fill="#2C2C2A">6 normali</text>

  <line x1="240" y1="410" x2="288" y2="418" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="402" width="175" height="32" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="377" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#412402">1 bomba ✱</text>
  <text x="377" y="428" text-anchor="middle" font-size="10" fill="#854F0B">suggerita dal cristiano</text>

  <!-- bomba → la prendi -->
  <line x1="465" y1="408" x2="503" y2="396" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="505" y="380" width="110" height="32" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="560" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#412402">La prendi →</text>

  <!-- bomba → la cestini -->
  <line x1="465" y1="424" x2="503" y2="436" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="505" y="420" width="110" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="560" y="436" text-anchor="middle" font-size="12" font-weight="600" fill="#2C2C2A">La cestini</text>
  <line x1="615" y1="436" x2="645" y2="436" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="647" y="420" width="85" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="689" y="433" text-anchor="middle" font-size="11" font-weight="600" fill="#085041">Day 4A</text>
  <text x="689" y="446" text-anchor="middle" font-size="10" fill="#0F6E56">Bimbo</text>

  <!-- freccia da "la prendi" verso il gore -->
  <line x1="560" y1="412" x2="560" y2="490" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- GORE — solo se hai la bomba -->
  <rect x="410" y="492" width="290" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="555" y="511" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">1 gore — solo se hai la bomba</text>
  <text x="555" y="530" text-anchor="middle" font-size="11" fill="#993C1D">il capo ti osserva dallo schermo</text>

  <!-- gore → ubbidisci (bomba esplode) -->
  <line x1="490" y1="542" x2="450" y2="578" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="580" width="190" height="50" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="445" y="598" text-anchor="middle" font-size="12" font-weight="600" fill="#501313">Ubbidisci al gore</text>
  <text x="445" y="616" text-anchor="middle" font-size="10" fill="#A32D2D">bomba esplode → muori</text>

  <!-- gore → non ubbidisci (ispezione) -->
  <line x1="620" y1="542" x2="660" y2="578" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="660" y="580" width="190" height="50" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="755" y="598" text-anchor="middle" font-size="12" font-weight="600" fill="#412402">Non ubbidisci</text>
  <text x="755" y="616" text-anchor="middle" font-size="10" fill="#854F0B">ispezione → trovano la bomba</text>

  <!-- entrambi → finale morte -->
  <line x1="445" y1="630" x2="540" y2="666" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="755" y1="630" x2="660" y2="666" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="440" y="668" width="320" height="50" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
  <text x="600" y="688" text-anchor="middle" font-size="14" font-weight="700" fill="#501313">Day 4B — Suicidio / Morte</text>
  <text x="600" y="708" text-anchor="middle" font-size="11" fill="#A32D2D">due strade, stesso esito</text>

  <!-- divider -->
  <line x1="20" y1="745" x2="880" y2="745" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="20" y="762" font-size="11" fill="#888780" font-style="italic">Finali — riepilogo</text>

  <!-- FINALE A BIMBO -->
  <rect x="20" y="775" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="125" y="793" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Finale A — Bimbo</text>
  <text x="125" y="812" text-anchor="middle" font-size="11" fill="#0F6E56">scelta morale giusta</text>
  <text x="248" y="803" font-size="11" fill="#444441">Il mondo peggiora, ma hai salvato qualcuno</text>

  <!-- FINALE B MORTE -->
  <rect x="20" y="850" width="210" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="125" y="868" text-anchor="middle" font-size="13" font-weight="600" fill="#501313">Finale B — Morte</text>
  <text x="125" y="887" text-anchor="middle" font-size="11" fill="#A32D2D">bomba esplode o ispezione</text>
  <text x="248" y="878" font-size="11" fill="#444441">Rottura col sistema, due varianti convergenti</text>

  <!-- LEGENDA MECCANICA -->
  <rect x="20" y="932" width="860" height="108" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="450" y="953" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">Paradosso morale — meccanica centrale</text>
  <rect x="36" y="962" width="256" height="66" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="164" y="981" text-anchor="middle" font-size="12" font-weight="600" fill="#0C447C">Capo (schermo)</text>
  <text x="164" y="997" text-anchor="middle" font-size="10" fill="#185FA5">ordini e feedback costanti</text>
  <text x="164" y="1013" text-anchor="middle" font-size="10" fill="#185FA5">giudica la tua performance</text>
  <rect x="312" y="962" width="256" height="66" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="440" y="981" text-anchor="middle" font-size="12" font-weight="600" fill="#4A1B0C">Cristiano (rifiuti)</text>
  <text x="440" y="997" text-anchor="middle" font-size="10" fill="#993C1D">porta oggetti da smistare</text>
  <text x="440" y="1013" text-anchor="middle" font-size="10" fill="#993C1D">propone la bomba</text>
  <rect x="588" y="962" width="276" height="66" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="726" y="981" text-anchor="middle" font-size="12" font-weight="600" fill="#412402">Finestra (mondo esterno)</text>
  <text x="726" y="997" text-anchor="middle" font-size="10" fill="#854F0B">scelte moralmente giuste</text>
  <text x="726" y="1013" text-anchor="middle" font-size="10" fill="#854F0B">→ routine peggiora sempre di più</text>

</svg>
